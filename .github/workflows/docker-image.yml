name: Build and Publish Image

on:
  push:
    branches: [main]

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Get Version
        run: |
          VER=$(cat version-image.txt)
          echo "VERSION=$VER" >> $GITHUB_ENV
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nschultz/fantasy-baseball-common-backend:${{ env.VERSION }}
            nschultz/fantasy-baseball-common-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
